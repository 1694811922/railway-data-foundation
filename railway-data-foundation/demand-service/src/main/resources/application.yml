server:
  address: ${DEMAND_BIND:127.0.0.1}
  port: ${DEMAND_PORT:18082}
  max-http-request-header-size: 16KB
spring:
  application:
    name: demand-service
  main:
    banner-mode: off
  datasource:
    url: ${DEMAND_DB_URL}
    username: ${DEMAND_DB_USER}
    password: ${DEMAND_DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 3000
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
logging:
  level:
    org.apache.kafka: ERROR
    org.springframework.web: INFO
    org.springframework.jdbc: INFO
    cn.railway.demand: INFO
demand:
  worker:
    enabled: ${DEMAND_WORKER_ENABLED:true}
