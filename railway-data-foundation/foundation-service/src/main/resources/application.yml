server:
  address: ${FOUNDATION_BIND:127.0.0.1}
  port: ${FOUNDATION_PORT:18080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${FOUNDATION_SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: foundation-service
  datasource:
    url: ${FOUNDATION_DB_URL}
    username: ${FOUNDATION_DB_USER}
    password: ${FOUNDATION_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: ${FOUNDATION_DB_CONNECTION_TIMEOUT_MS:5000}
      maximum-pool-size: ${FOUNDATION_DB_POOL_SIZE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
      fail-on-unknown-properties: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
foundation:
  registration:
    local-bootstrap-enabled: ${FOUNDATION_REGISTRATION_LOCAL_BOOTSTRAP_ENABLED:false}
